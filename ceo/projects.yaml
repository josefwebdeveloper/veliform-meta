# Veliform company project registry — source of truth for bootstrap + CEO updates.
company: veliform
workspace_root: ~/WORKSPACE/veliform

repos:
  - slug: meta
    name: Veliform Meta
    git: https://github.com/josefwebdeveloper/veliform-meta.git
    path: meta
    product_slug: null

  - slug: landing
    name: Veliform Company Site
    git: https://github.com/josefwebdeveloper/veliform-landing.git
    path: veliform-landing
    product_slug: veliform-company
    notion_workstream_slug: veliform-landing
    github: josefwebdeveloper/veliform-landing
    prod_url: https://veliform.com
    deploy: vercel

  - slug: voice
    name: Veliform Voice Agent
    git: https://github.com/josefwebdeveloper/voice-agent.git
    path: voice
    product_slug: veliform-voice
    notion_workstream_slug: voice-agent
    github: josefwebdeveloper/voice-agent
    path_prefixes:
      - apps/voice-server/
      - apps/personal-server/
      - apps/business-server/
      - docs/

  - slug: agent-company
    name: Crewdesk (Agent Company SaaS)
    git: https://github.com/josefwebdeveloper/agent-company.git
    path: agent-company
    product_slug: agent-company-saas
    notion_workstream_slug: agent-company
    github: josefwebdeveloper/agent-company
    prod_url: null
    deploy: vercel
    notes: MVP v1 — Supabase auth + Postgres + Vercel cron

# Future products (no repo yet): see ceo/ideas.yaml + docs/ideas/

# Add more repos:
