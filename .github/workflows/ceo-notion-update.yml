name: CEO Notion update

on:
  push:
    branches: [main]

jobs:
  log-ceo-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log CEO update to Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_CEO_UPDATES_DATABASE_ID: ${{ secrets.NOTION_CEO_UPDATES_DATABASE_ID }}
          NOTION_CEO_PROJECTS_DATABASE_ID: ${{ secrets.NOTION_CEO_PROJECTS_DATABASE_ID }}
        run: |
          if [ -z "$NOTION_API_KEY" ] || [ -z "$NOTION_CEO_UPDATES_DATABASE_ID" ]; then
            echo "Notion secrets not configured on this repo — skip"
            exit 0
          fi
          python3 scripts/notion_log_update.py \
            --slug veliform-landing \
            --source git \
            --title "${{ github.event.head_commit.message }}" \
            --summary "${{ github.event.head_commit.message }}" \
            --link "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
